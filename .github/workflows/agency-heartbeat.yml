# Wakes the Render service and runs one agent heartbeat every 10 minutes.
# Needs repo secrets: APP_URL (e.g. https://locallift-ai.onrender.com) and CRON_SECRET.
name: Agency heartbeat
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wake service (cold start can take ~60s)
        run: curl -s -o /dev/null -m 120 "${{ secrets.APP_URL }}/healthz" || true
      - name: Run heartbeat
        run: |
          for i in 1 2 3; do
            curl -fsS -m 60 "${{ secrets.APP_URL }}/api/cron/tick?key=${{ secrets.CRON_SECRET }}" && exit 0
            sleep 20
          done
          exit 1
